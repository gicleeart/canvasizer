name: Artwork to AR (GLB + USDZ)

on:
  repository_dispatch:
    types: [canvasizer_trigger]

permissions:
  contents: write # Kept for checkout and other potential actions

jobs:
  build-ar:
    runs-on: macos-latest
    env:
      USER_ID: ${{ github.event.client_payload.user_id }}
      UNIQUE_ID: ${{ github.event.client_payload.unique_filename_id }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        uses: actions/cache@v3
        with:
          path: blender
          key: blender-macos-4.2.0

      - name: Download Blender manually (if not cached)
        run: |
          mkdir -p blender
          if [ ! -f blender/Blender.app/Contents/MacOS/Blender ]; then
            echo "⬇️ Downloading Blender 4.2.0..."
            curl -L https://mirror.clarkson.edu/blender/release/Blender4.2/blender-4.2.0-macos-x64.dmg -o blender/blender.dmg
            hdiutil attach blender/blender.dmg -mountpoint /Volumes/Blender
            cp -R "/Volumes/Blender/Blender.app" blender/
            hdiutil detach /Volumes/Blender
          else
            echo "✅ Blender already cached"
          fi

      - name: Cache USD repo
        uses: actions/cache@v3
        with:
          path: USD
          key: usd-repo-${{ runner.os }}-${{ hashFiles('USD/.git/HEAD') }}

      - name: Clone USD (shallow if missing)
        run: |
          if [ ! -d "USD" ]; then
            git clone --depth 1 https://github.com/PixarAnimationStudios/USD.git
          fi

      - name: Cache USD build
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/usd-tools
          key: usd-build-${{ runner.os }}-${{ hashFiles('USD/build_scripts/build_usd.py') }}

      - name: Build USD tools (skip if already built)
        run: |
          if [ -f "${{ github.workspace }}/usd-tools/bin/usdzip" ]; then
            echo "✅ USD tools already built — skipping build"
          else
            cd USD
            python build_scripts/build_usd.py ${{ github.workspace }}/usd-tools --no-usdview --no-tests --no-imaging
          fi

      - name: Download artwork
        run: |
          mkdir -p assets scripts output
          curl -L "${{ github.event.client_payload.image_url }}" -o assets/artwork.png

      - name: Convert artwork to JPEG for maximum compatibility
        run: |
          sips -s format jpeg assets/artwork.png --out assets/artwork.jpg
          echo "ARIP_IMAGE_PATH_FINAL=${{ github.workspace }}/assets/artwork.jpg" >> $GITHUB_ENV

      - name: Create Blender script
        run: |
          # This step remains identical to your original script
          cat > scripts/make_ar_plane.py << 'PY'
          import bpy
          import os
          import math
          # === 1. SETUP ===
          img_path = os.environ["ARIP_IMAGE_PATH"]
          out_glb  = os.environ["ARIP_OUT_GLB"]
          out_usdz = os.environ["ARIP_OUT_USDZ"]
          os.makedirs(os.path.dirname(out_glb), exist_ok=True)
          os.makedirs(os.path.dirname(out_usdz), exist_ok=True)
          bpy.ops.wm.read_factory_settings(use_empty=True)

          # === 2. GEOMETRY AND IMAGE LOADING (✅ REVISED LOGIC) ===
          img = bpy.data.images.load(img_path)
          img.colorspace_settings.name = "sRGB"
          
          # Define the target size for the longest edge of the 3D model
          TARGET_LONG_EDGE_M = 1.50
          depth_m = 0.02

          # Get image pixel dimensions
          w_px = img.size[0]
          h_px = img.size[1]

          # Calculate width and height in meters based on the longest edge
          if w_px >= h_px: # Landscape or square image
              width_m = TARGET_LONG_EDGE_M
              height_m = width_m * (h_px / w_px)
          else: # Portrait image
              height_m = TARGET_LONG_EDGE_M
              width_m = height_m * (w_px / h_px)
          bpy.ops.mesh.primitive_plane_add(size=1.0, enter_editmode=False, location=(0, 0, 0))
          panel = bpy.context.active_object
          panel.name = "ArtPanel"
          mod = panel.modifiers.new(name="Solidify", type='SOLIDIFY')
          mod.thickness = depth_m
          mod.offset = 1.0
          bpy.ops.object.modifier_apply(modifier=mod.name)
          panel.scale = (width_m / 2.0, height_m / 2.0, 1.0)
          bpy.ops.object.transform_apply(scale=True)
          panel.rotation_euler[0] = math.radians(90)
          bpy.ops.object.transform_apply(rotation=True)
          # === 3. RADICALLY SIMPLIFIED MATERIAL SETUP ===
          mesh = panel.data
          mat_artwork = bpy.data.materials.new("ArtworkMaterial")
          mat_artwork.use_nodes = True
          nodes = mat_artwork.node_tree.nodes
          bsdf = nodes.get("Principled BSDF")
          tex_node = nodes.new("ShaderNodeTexImage")
          tex_node.image = img
          mat_artwork.node_tree.links.new(tex_node.outputs['Color'], bsdf.inputs['Base Color'])
          mesh.materials.append(mat_artwork)
          # === 4. EXPORT LOGIC ===
          bpy.ops.object.select_all(action='DESELECT')
          panel.select_set(True)
          bpy.context.view_layer.objects.active = panel
          print(f"📦 Exporting GLB to {out_glb}...")
          bpy.ops.export_scene.gltf(filepath=out_glb, export_format='GLB', use_selection=True, export_yup=True)
          print("✅ GLB export complete.")
          print(f"📦 Exporting USDZ to {out_usdz}...")
          bpy.ops.wm.usd_export(filepath=out_usdz, selected_objects_only=True, export_textures=True, relative_paths=False)
          print("✅ USDZ export complete.")
          PY

      - name: Run Blender headless
        env:
          ARIP_IMAGE_PATH: ${{ env.ARIP_IMAGE_PATH_FINAL }}
          ARIP_OUT_GLB: ${{ github.workspace }}/output/model-${{ env.UNIQUE_ID }}.glb
          ARIP_OUT_USDZ: ${{ github.workspace }}/output/model-${{ env.UNIQUE_ID }}.usdz
        run: blender/blender.app/Contents/MacOS/Blender -b -noaudio --python scripts/make_ar_plane.py

      # ----------------------------------------------------------------
      # CORRECTED UPLOAD STEPS
      # ----------------------------------------------------------------

      - name: Upload GLB model to Backblaze B2
        uses: trilom/b2-upload-action@v2 # ✅ CORRECTED ACTION
        with:
          b2-account-id: ${{ env.B2_KEY_ID }} # ✅ CORRECTED PARAMETER NAME
          b2-account-key: ${{ env.B2_APPLICATION_KEY }} # ✅ CORRECTED PARAMETER NAME
          b2-bucket: ${{ env.B2_BUCKET_NAME }} # ✅ CORRECTED PARAMETER NAME
          source-file: ${{ github.workspace }}/output/model-${{ env.UNIQUE_ID }}.glb # ✅ CORRECTED PARAMETER NAME
          destination-file: ${{ env.USER_ID }}/model-${{ env.UNIQUE_ID }}.glb # ✅ CORRECTED PARAMETER NAME

      - name: Upload USDZ model to Backblaze B2
        uses: trilom/b2-upload-action@v2 # ✅ CORRECTED ACTION
        with:
          b2-account-id: ${{ env.B2_KEY_ID }} # ✅ CORRECTED PARAMETER NAME
          b2-account-key: ${{ env.B2_APPLICATION_KEY }} # ✅ CORRECTED PARAMETER NAME
          b2-bucket: ${{ env.B2_BUCKET_NAME }} # ✅ CORRECTED PARAMETER NAME
          source-file: ${{ github.workspace }}/output/model-${{ env.UNIQUE_ID }}.usdz # ✅ CORRECTED PARAMETER NAME
          destination-file: ${{ env.USER_ID }}/model-${{ env.UNIQUE_ID }}.usdz # ✅ CORRECTED PARAMETER NAME

      - name: Upload AR artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: artwork-ar-${{ env.UNIQUE_ID }}
          path: output/*

      # ----------------------------------------------------------------
      # REVISED CALLBACK STEP (No changes needed here)
      # ----------------------------------------------------------------

      - name: POST back to WordPress
        env:
          WP_WEBHOOK_URL: ${{ secrets.WP_WEBHOOK_URL }}
          WP_WEBHOOK_TOKEN: ${{ secrets.WP_WEBHOOK_TOKEN }}
        run: |
          set -e
          
          GLB_URL="https://www.backblazeb2.com/file/${B2_BUCKET_NAME}/${USER_ID}/model-${UNIQUE_ID}.glb"
          USDZ_URL="https://www.backblazeb2.com/file/${B2_BUCKET_NAME}/${USER_ID}/model-${UNIQUE_ID}.usdz"
          
          echo "✅ Preparing to POST back to WordPress with the following URLs:"
          echo "GLB: $GLB_URL"
          echo "USDZ: $USDZ_URL"
          
          echo "POSTing to: $WP_WEBHOOK_URL"
          jq -n \
            --arg post_id "${{ github.event.client_payload.post_id }}" \
            --arg user_id "${{ github.event.client_payload.user_id }}" \
            --arg title "${{ github.event.client_payload.title }}" \
            --arg glb "$GLB_URL" \
            --arg usdz "$USDZ_URL" \
            --arg thumb "${{ github.event.client_payload.thumbnail_url }}" \
            '{post_id: $post_id, user_id: $user_id, title: $title, glb_url: $glb, usdz_url: $usdz, thumbnail_url: $thumb}' \
          | curl --verbose --request POST "$WP_WEBHOOK_URL" \
            --header "Authorization: Bearer $WP_WEBHOOK_TOKEN" \
            --header "Content-Type: application/json" \
            --data @-
